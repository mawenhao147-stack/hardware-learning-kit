<text x="710.0" y="364.0" font-size="17" fill="#2563eb" text-anchor="start" font-weight="700" font-family="'SF Mono','Menlo',monospace" opacity="1">R = (Vcc − Vf) / If</text>
<text x="710.0" y="396.0" font-size="12.5" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">例：5V 驱动红 LED (Vf=2.0V, If=10mA)</text>
<text x="710.0" y="422.0" font-size="12.5" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">R = (5−2)/0.01 = 300 Ω → 取 330 Ω</text>
<text x="710.0" y="448.0" font-size="12.5" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">例：3.3V 驱动白 LED (Vf=3.0V, If=5mA)</text>
<text x="710.0" y="474.0" font-size="12.5" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">R = (3.3−3.0)/0.005 = 60 Ω → 取 68 Ω</text>
