<line x1="314.0" y1="172.0" x2="314.0" y2="156.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
<line x1="303.0" y1="156.0" x2="325.0" y2="156.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/>
<text x="314.0" y="148.0" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">+5V / +12V</text>
<text x="336.0" y="222.0" font-size="13" fill="#111827" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">继电器线圈</text>
