<text x="440.0" y="266.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">续流二极管</text>
<text x="440.0" y="286.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">1N4148 / SS34</text>
<text x="440.0" y="306.0" font-size="12" fill="#dc2626" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">阴极(横杠)接电源正</text>
<line x1="314.0" y1="376.0" x2="314.0" y2="400.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<line x1="314.0" y1="400.0" x2="314.0" y2="414.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<line x1="300.0" y1="414.0" x2="328.0" y2="414.0" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="305.3" y1="420.0" x2="322.7" y2="420.0" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
<line x1="310.4" y1="426.0" x2="317.6" y2="426.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<rect x="560.0" y="90.0" width="500.0" height="210.0" rx="10" fill="#fbfcfe" stroke="#d7dee8" stroke-width="1.2" opacity="1"/>
<text x="580.0" y="122.0" font-size="15" fill="#111827" text-anchor="start" font-weight="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">基极电阻怎么算</text>
<text x="580.0" y="152.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">目标：让三极管进入「饱和」，Vce≈0.2V</text>
<text x="580.0" y="178.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">Ic = 负载电流（继电器约 70mA）</text>
<text x="580.0" y="204.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">饱和按强制 β=10 取 Ib = Ic/10 = 7mA</text>
<text x="580.0" y="230.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">Rb = (Vgpio − Vbe)/Ib = (3.3−0.7)/7mA ≈ 371Ω</text>
<text x="580.0" y="256.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">→ 取 330Ω；负载小(如 LED 20mA) 用 1kΩ 即可</text>
<text x="580.0" y="282.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">发射极接地 = 低边开关；高边请用 PNP / PMOS</text>
<rect x="560.0" y="330.0" width="500.0" height="220.0" rx="10" fill="#fbfcfe" stroke="#d7dee8" stroke-width="1.2" opacity="1"/>
<text x="580.0" y="362.0" font-size="15" fill="#111827" text-anchor="start" font-weight="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">选型与坑</text>
<text x="580.0" y="392.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">小信号管：S8050 / S9013 (NPN)，S8550 / S9012 (PNP)</text>
<text x="580.0" y="418.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">大电流：TIP122 达林顿，或直接用 NMOS (AO3400)</text>
<text x="580.0" y="444.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">① 忘接续流二极管 → 烧 GPIO / 烧三极管</text>
<text x="580.0" y="470.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">② Rb 太大 → 不饱和，三极管发烫</text>
<text x="580.0" y="496.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">③ 负载接发射极 = 射极跟随，压降大、难饱和</text>
<text x="580.0" y="522.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">④ 驱动 12V 负载时，GPIO 与负载电源必须共地</text></svg>