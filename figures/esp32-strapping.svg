<text x="196.0" y="310.0" font-size="13" fill="#374151" text-anchor="start" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">—</text>
