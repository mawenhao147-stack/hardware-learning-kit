<text x="946.0" y="368.0" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">常接 GPIO2，可当指示灯</text>
<line x1="668.0" y1="460.0" x2="940.0" y2="440.0" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"/>
