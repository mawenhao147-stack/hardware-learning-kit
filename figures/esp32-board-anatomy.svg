<text x="294.0" y="458.0" font-size="12.5" fill="#6b7280" text-anchor="end" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">3.3V 电平！5V 信号要分压</text>
<line x1="630.0" y1="330.0" x2="940.0" y2="290.0" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="630.0" cy="330.0" r="3.5" fill="#2563eb" stroke="none"/>
