<text x="946.0" y="308.0" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">发热大=压差大/负载大</text>
<line x1="630.0" y1="370.0" x2="940.0" y2="350.0" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"/>
