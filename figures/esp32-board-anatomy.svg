<text x="946.0" y="458.0" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">3V3 对外供电 ≤500mA</text>
<rect x="60.0" y="660.0" width="540.0" height="220.0" rx="10" fill="#fbfcfe" stroke="#d7dee8" stroke-width="1.2" opacity="1"/>
<text x="80.0" y="692.0" font-size="15" fill="#111827" text-anchor="start" font-weight="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">买开发板看这 5 点</text>
<text x="80.0" y="722.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">① 有自动下载电路（免按键烧录）</text>
<text x="80.0" y="748.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">② USB 芯片 CH340 / CP2102（驱动好找）</text>
<text x="80.0" y="774.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">③ 排针全引出（≥30 脚，含 ADC1）</text>
<text x="80.0" y="800.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">④ 板载 LED + 两个按键（EN/BOOT）</text>
<text x="80.0" y="826.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">⑤ 供电能力 ≥500mA（WiFi 峰值 300mA+）</text>
<rect x="640.0" y="660.0" width="540.0" height="220.0" rx="10" fill="#fbfcfe" stroke="#d7dee8" stroke-width="1.2" opacity="1"/>
<text x="660.0" y="692.0" font-size="15" fill="#111827" text-anchor="start" font-weight="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">模组 / 开发板 / 裸芯片 怎么选</text>
<text x="660.0" y="722.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">学习原型 → 开发板（USB/按键/LDO 全有）</text>
<text x="660.0" y="748.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">小批量产品 → 模组（射频已调好+有认证）</text>
<text x="660.0" y="774.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">大批量 → 裸芯片（需自调天线与认证）</text>
<text x="660.0" y="800.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">WROVER 比 WROOM 多 PSRAM，但占用 GPIO16/17</text>
<text x="660.0" y="826.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">金属外壳项目选 IPEX 外接天线版本</text></svg>