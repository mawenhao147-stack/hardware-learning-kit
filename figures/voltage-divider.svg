<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif"><rect width="1060" height="560" fill="#ffffff"/><text x="24.0" y="40.0" font-size="24" fill="#111827" text-anchor="start" font-weight="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">分压电路：把高电压「按比例」降到可测范围</text>
<text x="24.0" y="66.0" font-size="14" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">ADC 采样时 R 不宜过大（&gt;100k 会因采样电容充电不足而读数偏低）；做电源分压要计入负载电流</text>
<line x1="260.0" y1="90.0" x2="260.0" y2="74.0" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
<line x1="249.0" y1="74.0" x2="271.0" y2="74.0" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round"/>
<text x="260.0" y="66.0" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">Vin</text>
<line x1="260.0" y1="90.0" x2="260.0" y2="120.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<rect x="253.0" y="120.0" width="14.0" height="40.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="2" opacity="1"/>
<text x="280.0" y="144.0" font-size="14" fill="#111827" text-anchor="start" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">R1</text>
<line x1="260.0" y1="160.0" x2="260.0" y2="190.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<circle cx="260.0" cy="190.0" r="4" fill="#1f2937" stroke="none"/>
<line x1="260.0" y1="190.0" x2="410.0" y2="190.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<text x="418.0" y="195.0" font-size="14" fill="#2563eb" text-anchor="start" font-weight="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">Vout</text>
<rect x="253.0" y="190.0" width="14.0" height="40.0" rx="0" fill="#fff" stroke="#1f2937" stroke-width="2" opacity="1"/>
<text x="280.0" y="214.0" font-size="14" fill="#111827" text-anchor="start" font-weight="600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">R2</text>
<line x1="260.0" y1="230.0" x2="260.0" y2="260.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<line x1="260.0" y1="260.0" x2="260.0" y2="274.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<line x1="246.0" y1="274.0" x2="274.0" y2="274.0" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
<line x1="251.3" y1="280.0" x2="268.7" y2="280.0" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round"/>
<line x1="256.4" y1="286.0" x2="263.6" y2="286.0" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
<rect x="470.0" y="90.0" width="520.0" height="150.0" rx="10" fill="#fbfcfe" stroke="#d7dee8" stroke-width="1.2" opacity="1"/>
<text x="490.0" y="124.0" font-size="19" fill="#2563eb" text-anchor="start" font-weight="700" font-family="'SF Mono','Menlo',monospace" opacity="1">Vout = Vin × R2 / (R1 + R2)</text>
<text x="490.0" y="158.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">例：测 12V 电池 → 用 R1=30k、R2=10k，</text>
<text x="490.0" y="182.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">Vout = 12×10/40 = 3.0V，落在 3.3V ADC 量程内</text>
<text x="490.0" y="214.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">并联一个小电容(100nF)可滤噪声、稳定采样</text>
<rect x="470.0" y="270.0" width="520.0" height="220.0" rx="10" fill="#fbfcfe" stroke="#d7dee8" stroke-width="1.2" opacity="1"/>
<text x="490.0" y="302.0" font-size="15" fill="#111827" text-anchor="start" font-weight="700" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">三个常见坑</text>
<text x="490.0" y="334.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">① 负载会并联在 R2 上，负载电流大时分压比失真</text>
<text x="490.0" y="364.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">② 电阻自身耗电 P=Vin²/(R1+R2)，电池供电要选大阻值</text>
<text x="490.0" y="394.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">③ 电阻精度直接决定测量精度，用 ±1% 或 ±0.1%</text>
<text x="490.0" y="424.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">④ 测高于芯片耐压的电压前，先确认 ADC 最大输入</text>
<text x="490.0" y="454.0" font-size="13" fill="#374151" text-anchor="start" font-weight="normal" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',sans-serif" opacity="1">⑤ 分压点接 ADC 时串 1kΩ 可防浪涌损坏引脚</text></svg>